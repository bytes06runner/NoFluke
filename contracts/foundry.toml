[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
allow_paths = ["../node_modules"]
fs_permissions = [{ access = "read", path = "../config" }, { access = "read", path = "../shared/vectors" }]

[fuzz]
runs = 1024
